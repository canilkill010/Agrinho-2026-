<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGROFUTURO | A Força que Alimenta o Mundo</title>
    
    <!-- Ícones FontAwesome e Fonte Inter -->
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <!-- Estilos Visuais (CSS) -->
    <style>
        :root {
            --primary: #1e5631;
            --primary-light: #4c9a2a;
            --accent: #d4af37;
            --dark: #112211;
            --light: #f7f9f6;
            --white: #ffffff;
            --text: #444444;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            color: var(--text);
            background-color: var(--white);
            line-height: 1.7;
            padding-top: 80px;
        }

        /* Menu de Navegação */
        nav {
            background-color: rgba(17, 34, 17, 0.95);
            backdrop-filter: blur(10px);
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            box-shadow: 0 2px 20px rgba(0,0,0,0.1);
            height: 80px;
            display: flex;
            align-items: center;
        }

        .nav-container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }

        .logo {
            color: var(--white);
            font-size: 1.5rem;
            font-weight: 800;
            text-decoration: none;
            letter-spacing: 1px;
        }

        .logo span {
            color: var(--primary-light);
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 30px;
            align-items: center;
        }

        .nav-links a {
            color: #ccddcc;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            transition: var(--transition);
        }

        .nav-links a:hover {
            color: var(--primary-light);
        }

        /* Menu Hamburguer Celular */
        .menu-toggle {
            display: none;
            background: none;
            border: none;
            color: var(--white);
            font-size: 1.5rem;
            cursor: pointer;
        }

        /* Hero Header */
        header {
            background: linear-gradient(to bottom, rgba(17,34,17,0.7), rgba(17,34,17,0.85)), 
                        url('https://unsplash.com') no-repeat center center/cover;
            height: calc(100vh - 80px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: var(--white);
            padding: 0 20px;
        }

        header h1 {
            font-size: 4rem;
            font-weight: 800;
            margin-bottom: 20px;
            line-height: 1.2;
            letter-spacing: -1px;
        }

        header h1 span {
            background: linear-gradient(to right, #a3e635, #22c55e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            font-size: 1.25rem;
            max-width: 800px;
            margin-bottom: 40px;
            color: #e2e8f0;
        }

        .cta-btn {
            background-color: var(--primary-light);
            color: var(--white);
            padding: 15px 40px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 15px rgba(76, 154, 42, 0.4);
            transition: var(--transition);
        }

        .cta-btn:hover {
            background-color: var(--white);
            color: var(--primary);
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(255, 255, 255, 0.2);
        }

        /* Seções Gerais */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 100px 20px;
        }

        .section-header {
            text-align: center;
            max-width: 700px;
            margin: 0 auto 60px auto;
        }

        .section-tag {
            color: var(--primary-light);
            font-weight: 700;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            display: block;
            margin-bottom: 10px;
        }

        .section-title {
            font-size: 2.5rem;
            color: var(--dark);
            font-weight: 800;
        }

        /* Grid de Cards */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 30px;
        }

        .card {
            background: var(--white);
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.03);
            border: 1px solid #eee;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(to right, var(--primary), var(--primary-light));
            transform: scaleX(0);
            transform-origin: left;
            transition: var(--transition);
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.08);
        }

        .card:hover::before {
            transform: scaleX(1);
        }

        .card-icon {
            font-size: 2.5rem;
            color: var(--primary-light);
            margin-bottom: 25px;
            display: inline-block;
        }

        .card h3 {
            font-size: 1.4rem;
            margin-bottom: 15px;
            color: var(--dark);
        }

        /* Seção Estatísticas */
        .bg-dark-section {
            background-color: var(--dark);
            color: var(--white);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 40px;
            text-align: center;
        }

        .stat-item h2 {
            font-size: 3.5rem;
            color: var(--accent);
            font-weight: 800;
            margin-bottom: 5px;
        }

        .stat-item p {
            color: #a3b8a3;
            font-size: 1rem;
        }

        /* Lado a Lado (Flex) */
        .bg-light {
            background-color: var(--light);
        }

        .flex-container {
            display: flex;
            align-items: center;
            gap: 60px;
            flex-wrap: wrap;
        }

        .flex-col {
            flex: 1;
            min-width: 350px;
        }

        .image-wrapper {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }

        .flex-col img {
            width: 100%;
            display: block;
            transition: transform 0.5s ease;
        }

        .image-wrapper:hover img {
            transform: scale(1.05);
        }

        /* Newsletter */
        .newsletter-box {
            background: linear-gradient(135deg, var(--primary), var(--dark));
            border-radius: 16px;
            padding: 60px 40px;
            text-align: center;
            color: var(--white);
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
        }

        .newsletter-box h2 {
            font-size: 2.2rem;
            margin-bottom: 15px;
        }

        .newsletter-box p {
            color: #cbd5e1;
            max-width: 600px;
            margin: 0 auto 30px auto;
        }

        .form-group {
            display: flex;
            max-width: 500px;
            margin: 0 auto;
            gap: 10px;
        }

        .form-group input {
            flex: 1;
            padding: 15px 20px;
            border-radius: 30px;
            border: none;
            outline: none;
            font-size: 1rem;
        }

        .form-group button {
            background-color: var(--accent);
            color: var(--dark);
            border: none;
            padding: 0 25px;
            border-radius: 30px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
        }

        .form-group button:hover {
            background-color: var(--white);
            transform: scale(1.05);
        }

        /* Caixa de Sucesso do Formulário */
        .success-message {
            display: none;
            background-color: rgba(76, 154, 42, 0.2);
            border: 1px solid var(--primary-light);
            color: #a3e635;
            padding: 15px;
            border-radius: 30px;
            max-width: 500px;
            margin: 20px auto 0 auto;
            font-weight: 600;
        }

        /* Rodapé */
        footer {
            background-color: #0b150b;
            color: #889988;
            text-align: center;
            padding: 40px 20px;
            font-size: 0.9rem;
            border-top: 1px solid #1a2e1a;
        }

        /* Responsividade (Mobile) */
        @media(max-width: 992px) {
            header h1 { font-size: 3rem; }
